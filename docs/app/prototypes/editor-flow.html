function gameArt(g, pods) {

  if (g === "run") { lit.c = "green"; for (let i = 0; i < pods; i++) lit[i] = i === 1 ? "red" : "green"; }
  return setDrawing(Math.min(pods, g === "solo" ? 0 : g === "duo" ? 1 : pods), lit);
}

    }
  }
}

function stepCard(s, n) {
  const sel = S.selected === s.id, iss = issues(s, S.prog);
  const br = branches(s).map(([k, v]) => `<div class="branch">↳ <span>${k}: <b>${v}</b></span></div>`).join("");
  let ex = "";
  if (S.expert) {
    const c = compile(S.prog), names = c.owner[s.id] || [];
    const bl = c.json.blocks.filter((b) => names.includes(b.name));
    ex = `<div class="ports">${bl.map((b) => `${b.name} · ${b.type}${["body", "done", "next", "timeout", "pressed", "avoidHit", "true", "false", "long"].filter((k) => b[k]).map((k) => `<br>&nbsp;&nbsp;${k} → ${b[k]}`).join("")}`).join("<br>")}</div>`;
  }
  return `<button class="step" style="--c:${catVar(s.type)}" data-act="selStep" data-id="${s.id}" aria-pressed="${sel}"><span class="num">${ic(STEP[s.type].icon, 16)}</span><span><span class="txt">${n}. ${esc(describe(s))}</span>
  ${metaChips(s) || iss.length ? `<span class="meta">${iss.length ? `<span class="chip err">${ic("alert", 12)} ${iss.length} problem${iss.length > 1 ? "s" : ""}</span>` : ""}${metaChips(s)}</span>` : ""}
  ${br ? `<span class="branches">${br}</span>` : ""}${ex}</span></button>`;
}

function scrSim() {

  const sim = S.sim || { rings: {}, times: [], misses: 0, round: 0, log: "Tap Start. Then tap a pod when it lights up.", running: false, done: false };
  const ids = [-1, ...Array.from({ length: p.pods }, (_, i) => i)];
  const t = sim.times, avg = t.length ? Math.round(t.reduce((a, b) => a + b, 0) / t.length) : "–", best = t.length ? Math.min(...t) : "–";

    <div class="pods">${ids.map((id) => { const r = sim.rings[id] || "off"; return `<button class="pod" data-act="podTap" data-v="${id}" aria-label="${id < 0 ? "Central" : "Pod " + (id + 1)}">${ring(r, 76)}${id < 0 ? "Central" : "Pod " + (id + 1)}</button>`; }).join("")}</div>
    <p class="muted small" style="margin:0" aria-live="polite">${esc(sim.log)}</p>
    <div class="stats"><div><strong>${t.length}</strong><span>presses</span></div><div><strong>${avg}</strong><span>avg ms</span></div><div><strong>${best}</strong><span>best ms</span></div><div><strong>${sim.misses}</strong><span>misses</span></div></div>

    <p class="muted small" style="margin:0">The real simulator also has speed, step, breakpoints and a seed (spec §8). This one runs the same steps you see in the editor.</p>
  </main>`;
}

// ---------- sheets ----------
function sheetFrame(icon, title, sub, body, c = "var(--accent)", tall = false) {
  return `<div class="scrim" data-act="closeSheet"></div><section class="sheet ${tall ? "tall" : ""}" role="dialog" aria-label="${esc(title)}"><div class="sheet-h" style="--c:${c}"><span class="ic">${ic(icon, 18)}</span><span class="grow"><h3>${esc(title)}</h3>${sub ? `<p>${sub}</p>` : ""}</span><button class="ib" data-act="closeSheet" aria-label="Close">${ic("x")}</button></div><div class="sheet-b">${body}</div></section>`;
}
function timeLimitBlock(s) {
  return toggle("st.limitOn", "Time limit", s.limitOn ? `Too slow after ${sec(s.limit)}` : "Wait as long as it takes", s.limitOn,
    `${stepper("Seconds", sec(s.limit), "stLimit")}<div class="field"><span class="lbl">If too slow</span>${seg([["next", "Just go on"], ["miss", "Count a miss"]], s.tooSlow, "stTooSlow")}</div>`);
}
const recordBlock = (s) => toggle("st.record", "Record reaction time", s.record ? "Measured from light on to press" : "Not measured", s.record);
function sheetStep() {
  const f = findStep(S.sheet.id); if (!f) return "";
  const s = f.s, p = S.prog, def = STEP[s.type], iss = issues(s, p);
  let body = iss.map((m) => `<div class="issue">${ic("alert", 18)} ${esc(m)}</div>`).join("");
  switch (s.type) {
    case "led":
      body += `<div class="field"><span class="lbl">Colour</span>${swatches(s.color, "stColor", true)}</div>
      <div class="field"><span class="lbl">Which LEDs</span>${seg([["all", "All 18"], ["half", "Every second"], ["top", "Top 6"]], s.leds === "all" ? "all" : s.leds.length === 9 ? "half" : "top", "stLeds")}</div>`;
      break;
    case "pause":
      body += `<div class="field"><span class="lbl">How long</span>${seg([["fixed", "Always the same"], ["random", "Random between"]], s.mode, "stPauseMode")}</div>
      ${s.mode === "random" ? `<div class="row" style="flex-wrap:wrap">${stepper("Shortest", sec(s.min), "stMin")}${stepper("Longest", sec(s.max), "stMax")}</div>` : stepper("Seconds", sec(s.fixed), "stFixed")}
      ${toggle("st.catchEarly", "Catch early presses", s.catchEarly ? "Pressing the central now is a false start" : "Presses during the pause are ignored", !!s.catchEarly,
        toggle("st.earlyMiss", "Count it as a miss", "Adds 1 to Misses", !!s.earlyMiss))}`;
      break;
    case "press":
      body += `<p class="muted small" style="margin:0">Waits until someone presses the central's button.</p>${timeLimitBlock(s)}${recordBlock(s)}
      ${toggle("st.longOn", "Long press does something else", s.longOn ? `Held ${sec(s.longMs)} or longer skips to the next round` : "Short and long presses do the same", !!s.longOn, stepper("Long press from", sec(s.longMs || 1), "stLong"))}
      <details class="more"><summary>${ic("sliders", 18)} More options</summary><div class="tg-body"><div class="field"><label for="storeas">Keep the last time in a setting</label><input id="storeas" class="input" placeholder="not kept" value="${esc(s.storeAs)}" data-in="stStoreAs"><span class="muted small">Use it later in a Decide step, e.g. "if the last time is under 300 ms".</span></div></div></details>`;
      break;
    case "pod": {
      const t = [["random", "Random pod"], ["randomOther", "Random, never twice"], ...Array.from({ length: Math.max(p.pods, typeof s.target === "number" ? s.target + 1 : 0) }, (_, i) => [i, `Pod ${i + 1}`])];
      body += `<div class="field"><span class="lbl">Which pod</span><div class="picks">${t.map(([v, l]) => `<button class="pick" data-act="stTarget" data-v="${v}" aria-pressed="${String(s.target) === String(v)}">${l}</button>`).join("")}</div></div>
      ${s.avoid ? "" : `<div class="field"><span class="lbl">Colour</span>${swatches(s.color, "stColor")}<span class="muted small">Pods show 8 named colours.</span></div>`}
      ${toggle("st.avoid", "Don't touch (red)", s.avoid ? "Pressing it is a miss, leaving it alone is right" : "The pod has to be pressed", !!s.avoid)}
      ${timeLimitBlock(s)}${s.avoid ? "" : recordBlock(s)}
      <details class="more"><summary>${ic("sliders", 18)} More options</summary><div class="tg-body"><div class="field"><span class="lbl">Colour after the press</span>${swatches(s.colorAfter, "stAfter", true)}</div></div></details>`;
      break;
    }
    case "race":
      body += `<div class="field"><span class="lbl">Colour to hit</span>${swatches(s.color, "stColor")}</div>
      ${toggle("st.avoidOn", "Red pods: don't touch", s.avoidOn ? `${s.avoidCount} red pod${s.avoidCount > 1 ? "s" : ""}, chosen at random` : "Every pod has to be pressed", s.avoidOn,
        `${stepper("Red pods", s.avoidCount, "stAvoid")}${toggle("st.avoidMiss", "Count a red hit as a miss", "Adds 1 to Misses", !!s.avoidMiss)}`)}
      ${timeLimitBlock(s)}${recordBlock(s)}
      <details class="more"><summary>${ic("sliders", 18)} More options</summary><div class="tg-body">${toggle("st.includeCentral", "The central takes part", "Its LEDs light up like a pod", s.includeCentral)}${stepper("Sync start (ms)", s.syncStart, "stSync")}<span class="muted small">Pods wait this long so they light up together.</span></div></details>`;
      break;
    case "results":
      body += `<p class="muted small" style="margin:0">Shows the recorded reaction times of this run. Each choice also keeps the value in a setting.</p>
      ${toggle("st.avg", "Average", "AVG_REACTION", s.avg)}${toggle("st.best", "Best (fastest)", "BEST_REACTION", s.best)}${toggle("st.worst", "Worst (slowest)", "WORST_REACTION", s.worst)}${toggle("st.count", "Number of presses", "COUNT_REACTION", s.count)}`;
      break;
    case "count":
      body += `<div class="field"><span class="lbl">Setting</span><div class="picks">${["MISSES", "STREAK"].map((v) => `<button class="pick" data-act="stVar" data-v="${v}" aria-pressed="${s.var === v}">${label(v)}</button>`).join("")}<button class="pick" data-act="noop">+ New setting…</button></div></div>
      <div class="field"><span class="lbl">What to do</span>${seg([["+", "Add"], ["=", "Set to"]], s.op, "stOp")}</div>${stepper("Value", s.value, "stValue")}`;
      break;
    case "decide":
      body += `<div class="field"><span class="lbl">Question</span><div class="picks"><button class="pick" aria-pressed="true">${label(s.left)}</button><button class="pick" aria-pressed="true">is at least</button></div></div>${stepper("Value", s.right, "stRight")}`;
      break;
    case "off": body += `<p class="muted small" style="margin:0">Turns off every pod's LEDs and stops waiting for them.</p>`; break;
  }
  body += `<div class="actions"><button class="btn small" data-act="addAfter">${ic("plus", 18)} Add after</button><button class="btn small" data-act="dupStep">${ic("copy", 18)} Duplicate</button>
  <button class="btn small" data-act="moveStep" data-d="-1" ${f.i === 0 ? "disabled" : ""}>${ic("up", 18)} Move up</button><button class="btn small" data-act="moveStep" data-d="1" ${f.i === f.list.length - 1 ? "disabled" : ""}>${ic("down", 18)} Move down</button>

  if (S.expert) {
    const c = compile(p), names = c.owner[s.id] || [];
    const bl = c.json.blocks.filter((b) => names.includes(b.name));
    body += `<div class="expert"><h4>Expert · blocks behind this step</h4><div class="field"><label for="bname">Block name</label><input id="bname" class="input" value="${esc(names[0] || "")}" style="font-family:var(--font-mono)" readonly></div><pre class="json">${esc(JSON.stringify(bl, null, 2))}</pre><span class="muted small">Port selects, block type change and raw keys live here, as in today's inspector.</span></div>`;
  }
  return sheetFrame(def.icon, def.name, f.list === p.round ? `Step ${f.i + 1} of each round` : `Step ${f.i + 1} after the last round`, body, catVar(s.type), true);
}

// ---------- simulator ----------
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let simToken = 0, waiter = null;
function waitPress(ids, ms) {
  return new Promise((resolve) => {
    const t0 = performance.now();
    const timer = ms ? setTimeout(() => { waiter = null; resolve(null); }, ms) : null;
    waiter = { ids, hit: (id) => { if (timer) clearTimeout(timer); waiter = null; resolve({ id, ms: Math.round(performance.now() - t0) }); } };
  });
}
async function runSim() {
  const tok = ++simToken, p = S.prog, sim = (S.sim = { rings: {}, times: [], misses: 0, round: 0, log: "Get ready…", running: true, done: false, last: null });
  const alive = () => tok === simToken;
  const show = (log) => { if (log) sim.log = log; if (S.screen === "simulate") render(); };
  const ring = (id, c) => { sim.rings[id] = c; show(); };
  const pick = (t) => {
    if (typeof t === "number") return t;
    const opts = t === "random" ? [...Array(p.pods).keys()] : [-1, ...Array(p.pods).keys()].filter((x) => x !== sim.last);
    const v = opts[Math.floor(Math.random() * opts.length)]; sim.last = v; return v;
  };
  const dur = (s) => (s.mode === "random" ? s.min + Math.random() * (s.max - s.min) : s.fixed) * 1000;
  const miss = (why) => { sim.misses++; show(why); };
  async function exec(s) {
    if (!alive()) return "stop";
    switch (s.type) {
      case "led": ring(-1, s.color); return;
      case "pause": {
        if (!s.catchEarly) { await sleep(dur(s)); return; }
        const r = await waitPress([-1], dur(s));
        if (r) { ring(-1, "red"); s.earlyMiss ? miss("False start: pressed during the pause.") : show("False start: pressed during the pause."); await sleep(600); ring(-1, "off"); return "endRound"; }
        return;
      }
      case "press": {
        show("Press the central now.");
        const r = await waitPress([-1], s.limitOn ? s.limit * 1000 : null);
        if (!alive()) return "stop";
        if (r) { if (s.record) sim.times.push(r.ms); show(`Central: ${r.ms} ms`); } else s.tooSlow === "miss" ? miss("Too slow.") : show("Too slow, going on.");
        return;
      }
      case "pod": {
        const id = pick(s.target);
        ring(id, s.avoid ? "red" : s.color); show(s.avoid ? `${id < 0 ? "Central" : "Pod " + (id + 1)} is red: don't touch.` : `Press ${id < 0 ? "the central" : "pod " + (id + 1)}.`);
        const r = await waitPress([id], s.limitOn ? s.limit * 1000 : s.avoid ? 2000 : null);
        if (!alive()) return "stop";
        ring(id, s.colorAfter || "off");
        if (s.avoid) { r ? miss("Touched the red pod.") : show("Left it alone. Good."); return; }
        if (r) { if (s.record) sim.times.push(r.ms); show(`${id < 0 ? "Central" : "Pod " + (id + 1)}: ${r.ms} ms`); } else s.tooSlow === "miss" ? miss("Too slow.") : show("Too slow, going on.");
        return;
      }
      case "race": {
        const ids = [...(s.includeCentral ? [-1] : []), ...Array(p.pods).keys()];
        const red = new Set(s.avoidOn ? [...ids].sort(() => Math.random() - 0.5).slice(0, Math.min(s.avoidCount, ids.length - 1)) : []);
        const green = new Set(ids.filter((i) => !red.has(i)));
        ids.forEach((i) => (sim.rings[i] = red.has(i) ? "red" : s.color)); show(`Hit every ${s.color} pod.`);
        const t0 = performance.now();
        while (green.size) {
          const left = s.limitOn ? s.limit * 1000 - (performance.now() - t0) : null;
          if (left !== null && left <= 0) { s.tooSlow === "miss" ? miss("Too slow.") : show("Too slow."); break; }
          const r = await waitPress(ids, left);
          if (!alive()) return "stop";
          if (!r) { s.tooSlow === "miss" ? miss("Too slow.") : show("Too slow."); break; }
          if (red.has(r.id)) { ids.forEach((i) => (sim.rings[i] = "red")); s.avoidMiss ? miss("Red pod hit.") : show("Red pod hit."); await sleep(1000); ids.forEach((i) => (sim.rings[i] = "off")); return "endRound"; }
          if (green.has(r.id)) { green.delete(r.id); sim.rings[r.id] = "off"; if (s.record) sim.times.push(Math.round(performance.now() - t0)); show(`${r.id < 0 ? "Central" : "Pod " + (r.id + 1)} after ${Math.round(performance.now() - t0)} ms`); }
        }
        return;
      }
      case "off": Object.keys(sim.rings).forEach((k) => (sim.rings[k] = "off")); show(); return;
      case "count": sim[s.var] = (s.op === "+" ? sim[s.var] || 0 : 0) + s.value; if (s.var === "MISSES") sim.misses = sim.MISSES; return;
      case "results": {
        const t = sim.times, parts = [];
        if (s.count) parts.push(`${t.length} presses`);
        if (s.avg && t.length) parts.push(`average ${Math.round(t.reduce((a, b) => a + b, 0) / t.length)} ms`);
        if (s.best && t.length) parts.push(`best ${Math.min(...t)} ms`);
        if (s.worst && t.length) parts.push(`worst ${Math.max(...t)} ms`);
        sim.result = parts.join(", ") || "No times recorded."; return;
      }
    }
  }
  for (let r = 1; r <= p.rounds && alive(); r++) {
    sim.round = r; show();
    for (const s of p.round) { const res = await exec(s); if (res === "endRound" || res === "stop") break; }
  }
  for (const s of p.end) { if (!alive()) return; await exec(s); }
  if (!alive()) return;
  sim.running = false; sim.done = true; Object.keys(sim.rings).forEach((k) => (sim.rings[k] = "off")); show("Done.");
}
function stopSim() { simToken++; waiter = null; if (S.sim) S.sim.running = false; }

  progName(d, el) { if (S.prog) { edit((p) => (p.name = el.value || p.name)); } },
  progDesc(d, el) { edit((p) => (p.desc = el.value)); },
  trySim() { if (!S.prog) return; S.from = S.sheet?.kind === "adjust" ? "programs" : S.screen; S.sim = null; go("simulate"); },
  simBack() { stopSim(); go(S.from || "editor"); },
  simStart() { runSim(); },
  simStop() { stopSim(); S.sim.log = "Stopped."; render(); },
  podTap(d) { const id = +d.v; if (waiter && waiter.ids.includes(id)) waiter.hit(id); else if (S.sim?.running) { S.sim.log = "Not now: that pod is not waiting for a press."; render(); } },
  toEditor() { if (S.origin === "new") { S.mine.unshift(S.prog); S.origin = "mine"; } else if (S.origin === "shipped" && S.sheet?.kind === "adjust") { /* keep */ } go("editor"); },
  saveMenu() { if (S.origin === "new") { S.mine.unshift(structuredClone(S.prog)); S.origin = "mine"; } go("programs"); toast(`"${S.prog.name}" is in the menu. Push it on the Pod page.`); render(); },
  openProg(d) { const p = lookup(d.id, d.o); openEditor(p, d.o); if (d.o !== "mine") { toast(d.o === "pod" ? "Read-only pod: your first change makes a local copy." : "Shipped program: your first change makes your own copy."); render(); } },
  adjust(d) { const p = lookup(d.id, d.o); setProg(p, d.o); S.sheet = { kind: "adjust" }; render(); },
  saveAdjust() {
    if (S.origin === "shipped" || S.origin === "pod") { const c = structuredClone(S.prog); c.id = "p" + uid++; c.name += " (my copy)"; S.mine.unshift(c); S.prog = c; S.origin = "mine"; toast(`Saved as "${c.name}".`); }
    else { saveMine(); toast("Saved."); }
    S.sheet = null; render();
  },
  sheet(d) { S.sheet = { kind: d.v }; render(); },
  closeSheet() { S.sheet = null; render(); },
  selStep(d) { S.selected = d.id; S.sheet = { kind: "step", id: d.id }; render(); },
  undo() { if (!S.hist.length) return; S.fut.push(JSON.stringify(S.prog)); S.prog = JSON.parse(S.hist.pop()); saveMine(); if (S.sheet?.id && !findStep(S.sheet.id)) S.sheet = null; render(); },
  redo() { if (!S.fut.length) return; S.hist.push(JSON.stringify(S.prog)); S.prog = JSON.parse(S.fut.pop()); saveMine(); render(); },
  toastUndo() { const u = S.toast?.undo; S.toast = null; if (u) ACT.undo(); else render(); },
  addTo(d) { S.sheet = { kind: "add", where: { list: d.v } }; render(); },
  addAfter() { const f = findStep(S.sheet.id); S.sheet = { kind: "add", where: { list: f.list === S.prog.round ? "round" : "end", after: f.s.id } }; render(); },
  addStep(d) {
    const w = S.sheet.where, prev = S.prog.round.find((s) => s.limitOn);
    const defs = {
      led: { color: S.prog.menuColor, leds: "all" }, pause: { mode: "fixed", fixed: 1, min: 1, max: 3 },
      press: { limitOn: !!prev, limit: prev?.limit || 2, tooSlow: prev?.tooSlow || "next", record: true, storeAs: "" },
      pod: { target: "random", color: S.prog.menuColor, avoid: false, limitOn: !!prev, limit: prev?.limit || 2, tooSlow: "next", record: true, colorAfter: "off", storeAs: "" },
      race: { color: S.prog.menuColor, avoidOn: false, avoidCount: 1, avoidColor: "red", includeCentral: true, limitOn: false, limit: 2, tooSlow: "next", record: true, syncStart: 20 },
      off: {}, count: { var: "MISSES", op: "+", value: 1 }, decide: { left: "MISSES", right: 3 }, results: { avg: true, best: true, worst: false, count: true },
    };
    const s = mk(d.v, structuredClone(defs[d.v]));
    edit((p) => { const list = w.list === "end" ? p.end : p.round; const i = w.after ? list.findIndex((x) => x.id === w.after) + 1 : list.length; list.splice(i, 0, s); });
    S.selected = s.id; S.sheet = { kind: "step", id: s.id }; render();
  },
  recipe(d) {
    if (d.v === "miss") edit((p) => p.round.forEach((s) => { if ("limitOn" in s && !s.avoid) { s.limitOn = true; s.limit ||= 2; s.tooSlow = "miss"; } }));
    if (d.v === "breath") edit((p) => p.round.push(mk("pause", { mode: "fixed", fixed: 2, min: 1, max: 3 })));
    if (d.v === "flash") edit((p) => { const s = p.round.find((x) => x.type === "pause"); if (s) { s.catchEarly = true; s.earlyMiss = true; } });
    S.sheet = null; toast("Recipe added.", true); render();
  },
  dupStep() { const f = findStep(S.sheet.id); const c = { ...structuredClone(f.s), id: "s" + uid++ }; edit(() => f.list.splice(f.i + 1, 0, c)); S.selected = c.id; S.sheet = { kind: "step", id: c.id }; render(); },
  moveStep(d) { const id = S.sheet.id; edit(() => { const f = findStep(id), j = f.i + +d.d; [f.list[f.i], f.list[j]] = [f.list[j], f.list[f.i]]; }); },
  delStep() { const f = findStep(S.sheet.id), t = describe(f.s); edit(() => f.list.splice(f.i, 1)); S.sheet = null; S.selected = null; toast(`Deleted "${t}".`, true); render(); },
  dupProg() { const c = structuredClone(S.prog); c.id = "p" + uid++; c.name += " (copy)"; S.mine.unshift(c); setProg(c, "mine"); S.sheet = null; toast("Duplicated."); render(); },
  stColor(d) { stepEdit((s) => (s.color = d.v)); },
  stAfter(d) { stepEdit((s) => (s.colorAfter = d.v)); },
  stLeds(d) { stepEdit((s) => (s.leds = d.v === "all" ? "all" : d.v === "half" ? [0, 2, 4, 6, 8, 10, 12, 14, 16] : [15, 16, 17, 0, 1, 2])); },
  stPauseMode(d) { stepEdit((s) => (s.mode = d.v)); },
  stMin(d) { stepEdit((s) => (s.min = half(s.min, +d.d))); },
  stMax(d) { stepEdit((s) => (s.max = half(s.max, +d.d))); },
  stFixed(d) { stepEdit((s) => (s.fixed = half(s.fixed, +d.d))); },
  stLimit(d) { stepEdit((s) => (s.limit = half(s.limit, +d.d, 0.5))); },
  stLong(d) { stepEdit((s) => (s.longMs = half(s.longMs || 1, +d.d, 0.5, 5))); },
  stTooSlow(d) { stepEdit((s) => (s.tooSlow = d.v)); },
  stTarget(d) { stepEdit((s) => (s.target = /^\d+$/.test(d.v) ? +d.v : d.v)); },
  stAvoid(d) { stepEdit((s) => (s.avoidCount = clampN(s.avoidCount + +d.d, 1, 7))); },
  stSync(d) { stepEdit((s) => (s.syncStart = clampN(s.syncStart + +d.d * 10, 0, 200))); },
  stVar(d) { stepEdit((s) => (s.var = d.v)); },
  stOp(d) { stepEdit((s) => (s.op = d.v)); },
  stValue(d) { stepEdit((s) => (s.value = clampN(s.value + +d.d, 0, 99))); },
  stRight(d) { stepEdit((s) => (s.right = clampN(s.right + +d.d, 0, 99))); },
  stStoreAs(d, el) { stepEdit((s) => (s.storeAs = el.value.toUpperCase().replace(/[^A-Z0-9_]/g, ""))); },
  pPods(d) { edit((p) => (p.pods = clampN(p.pods + +d.d, 0, 7))); },
  pRounds(d) { applyAdjust((p) => (p.rounds = clampN(p.rounds + +d.d, 1, 99))); },
  pMenu(d) { edit((p) => (p.menuColor = d.v)); },
  aPauseMode(d) { applyAdjust((p) => p.round.filter((s) => s.type === "pause").forEach((s) => (s.mode = d.v))); },
  aMin(d) { applyAdjust((p) => p.round.filter((s) => s.type === "pause").forEach((s) => (s.min = half(s.min, +d.d)))); },
  aMax(d) { applyAdjust((p) => p.round.filter((s) => s.type === "pause").forEach((s) => (s.max = half(s.max, +d.d)))); },
  aFixed(d) { applyAdjust((p) => p.round.filter((s) => s.type === "pause").forEach((s) => (s.fixed = half(s.fixed, +d.d)))); },
  aLimit(d) { applyAdjust((p) => allSteps(p).filter((s) => "limitOn" in s).forEach((s) => (s.limit = half(s.limit || 2, +d.d, 0.5)))); },
};
document.addEventListener("click", (e) => { const el = e.target.closest("[data-act]"); if (!el || el.disabled) return; const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset, el); } });
document.addEventListener("change", (e) => { const el = e.target.closest("[data-in]"); if (el && ACT[el.dataset.in]) ACT[el.dataset.in](el.dataset, el); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) { S.sheet = null; render(); } });
render();
})();
</script>
