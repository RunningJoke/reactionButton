# Builds the firmware, checks the shipped programs and runs the tools tests on every PR and push to main.
name: Firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", "tools/*.py", "tools/*.json", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "tools/*.py", "tools/*.json", ".github/workflows/firmware.yml"]
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      OTA_SIGNING_KEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ hashFiles('firmware/platformio.ini', 'firmware/sdkconfig.NewBoard') }}
      - run: pip install platformio
      # Release: sign with the release key (PEM in the secret). Otherwise sign_ota.py makes a throw-away test key.
      - name: OTA signing key
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$OTA_SIGNING_KEY" ]; then
            printf '%s\n' "$OTA_SIGNING_KEY" > "$RUNNER_TEMP/ota_key.pem"
            echo "OTA_SIGNING_KEY_FILE=$RUNNER_TEMP/ota_key.pem" >> "$GITHUB_ENV"
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::secret OTA_SIGNING_KEY is missing: a release must be signed with the release key (testing.md §14)"; exit 1
          fi
      - run: python tools/validate_programs.py
      - run: pip install bleak pyserial && python -m unittest discover -s tools -p "test_*.py"
      - run: pio test -d firmware -e native
      - run: pio run -d firmware -e NewBoard
      # report only: findings show in the log, they do not fail the job
      - run: pio check -d firmware -e NewBoard --fail-on-defect=high
        continue-on-error: true
      - name: Flash usage
        run: |
          bin=$(stat -c %s firmware/.pio/build/NewBoard/firmware.bin)
          slot=$(( $(awk -F'[,[:space:]]+' '$3 == "ota_0" || $3 == "factory" { print $5; exit }' firmware/partitions.csv) ))
          echo "firmware.bin: $bin bytes of $slot ($((100 * bin / slot)) % of the app slot)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ $((bin * 100)) -gt $((95 * slot)) ]; then echo "::error::firmware.bin is over 95 % of the app slot"; exit 1; fi
          if [ $((bin * 100)) -gt $((85 * slot)) ]; then echo "::warning::firmware.bin is over 85 % of the app slot"; fi
      - run: pio run -d firmware -e NewBoard -t buildfs
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/.pio/build/NewBoard/firmware.bin
            firmware/.pio/build/NewBoard/bootloader.bin
            firmware/.pio/build/NewBoard/partitions.bin
            firmware/.pio/build/NewBoard/spiffs.bin
