                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                          description: ISO 8601 timestamp
                        actorUserId:
                          anyOf:
                            - type: string
                              format: uuid
                              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                            - type: "null"
                        actorKind:
                          type: string
                        via:
                          type: string
                          description: rest, mcp or internal
                        action:
                          type: string
                        resourceType:
                          type: string
                        resourceId:
                          type:
                            - string
                            - "null"
                        details:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties: {}
                      required:
                        - id
                        - at
                        - actorUserId
                        - actorKind
                        - via
                        - action
                        - resourceType
                        - resourceId
                        - details
                      additionalProperties: false
                  nextCursor:
                    anyOf:
                      - type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      - type: "null"
                required:
                  - entries
                  - nextCursor
                additionalProperties: false
        "400":
          description: Invalid input
          content: &a29
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not signed in
          content: *a29
        "403":
          description: Not allowed
          content: *a29
components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
        title:
          type: string
          description: stable error code, e.g. invalid_input
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required:
        - type
        - title
        - status
        - detail
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: OAuth 2.1 access token or personal access token (PL1)
