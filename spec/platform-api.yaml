      summary: API information
      description: Version of the ReactPod platform API, the program format it understands, its features and limits. Call this first to find out what the platform supports.
      tags:
        - meta
      x-agent: allow
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: string
                    const: v1
                  version:
                    type: string
                    description: platform release
                  programFormat:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: PROGRAM_FORMAT revision of block fields and semantics (programs.md §6)
                  features:
                    type: array
                    items:
                      type: string
                  limits:
                    type: object
                    properties:
                      maxFileSize:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                        description: bytes per program file
                      maxPath:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                        description: characters per store path
                      maxIncludeDepth:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      maxPeripherals:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                    required:
                      - maxFileSize
                      - maxPath
                      - maxIncludeDepth
                      - maxPeripherals
                    additionalProperties: false
                required:
