  /v1/orgs/{orgId}/training/upload:
    post:
      operationId: upload_training
      summary: Upload training results
      description: "Uploads training sessions with their reports from the app's offline queue. Idempotent: sessions and reports are found again by the app's ids, so a retry stores nothing twice; a repeated report may only change `discarded`. Coaches upload for their athletes, athletes for their own profile."
      tags:
        - training
      security:
        - bearer:
            - results:write
      x-agent: deny
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessions:
                  minItems: 1
                  maxItems: 50
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        description: UUID made by the app
                      athleteId:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      setId:
                        type: string
                        pattern: ^[0-9a-fA-F]{1,16}$
                        description: the pod set's setId (hex, from the firmware)
                      programPath:
                        type: string
                        maxLength: 31
                        format: starts_with
                        pattern: ^\/.*
                        description: pod path of the program, e.g. /prog/dreieck.json
                      revisionId:
                        description: platform revision the program came from, if known
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      presetId:
                        description: platform preset the program came from, if known
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      contentSha256:
                        description: SHA-256 of the program file on the pod
                        type: string
                        pattern: ^[0-9a-f]{64}$
                      startedAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                        description: ISO 8601 timestamp
                      notes:
                        default: ""
                        type: string
                        maxLength: 500
                      reports:
                        default: []
                        maxItems: 200
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                              description: UUID made by the app; a repeated upload with the same id stores nothing twice
                            podReportId:
                              description: the pod's report id (restarts after a reboot)
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                            cycle:
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                            startMs:
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                            endMs:
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                            recordedAt:
                              type: string
                              format: date-time
                              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                              description: when the app received the report
                            discarded:
                              default: false
                              description: "followed by a repeat: kept, not counted"
                              type: boolean
                            values:
                              default: []
                              maxItems: 2000
                              type: array
                              items:
                                type: object
                                properties:
                                  t:
                                    type: integer
                                    minimum: 0
                                    maximum: 9007199254740991
                                    description: pod time, ms since the central started
                                  metric:
                                    type: string
                                    minLength: 1
                                    maxLength: 32
                                  pod:
                                    type: integer
                                    minimum: 0
                                    maximum: 255
                                  ms:
                                    type: integer
                                    minimum: 0
                                    maximum: 86400000
                                required:
                                  - t
                                  - metric
                                  - pod
                                  - ms
                            stats:
                              default: {}
                              description: the firmware's statistics, kept as sent
                              type: object
                              propertyNames:
                                type: string
                                minLength: 1
                                maxLength: 32
                              additionalProperties:
                                type: object
                                properties:
                                  count:
                                    type: integer
                                    minimum: 0
                                    maximum: 9007199254740991
                                  average:
                                    type: number
                                  best:
                                    type: number
                                  worst:
                                    type: number
                                required:
                                  - count
                                  - average
                                  - best
                                  - worst
                            vars:
                              default: {}
                              type: object
                              propertyNames:
                                type: string
                                minLength: 1
                                maxLength: 32
                              additionalProperties:
                                type: number
                          required:
                            - id
                            - recordedAt
                    required:
                      - id
                      - athleteId
                      - programPath
                      - startedAt
              required:
                - sessions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        clientId:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        created:
                          type: boolean
                      required:
                        - clientId
                        - id
                        - created
                      additionalProperties: false
                  reports:
                    type: array
                    items:
                      type: object
                      properties:
                        clientId:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        status:
                          type: string
                          enum:
                            - created
                            - updated
                            - unchanged
                      required:
                        - clientId
                        - id
                        - status
                      additionalProperties: false
                required:
                  - sessions
                  - reports
                additionalProperties: false
        "400":
          description: Invalid input
          content: &a44
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not signed in
          content: *a44
        "403":
          description: Not allowed
          content: *a44
