          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/programs/validate:
    post:
      operationId: validate_program
      summary: Validate a program
      description: Checks a ReactPod program with the same rules as the Config App and the firmware loader (docs/firmware/programs.md). Pass the program file and any include files it needs; the shipped library parts (/prog/lib/*.json) are available without passing them. Errors stop a program from running on a pod, warnings do not.
      tags:
        - programs
      x-agent: allow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  default: /prog/program.json
                  description: store path of the program among `files`, e.g. /prog/sprint.json
                  type: string
                files:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
                  description: store path → file text (JSON as stored on the pod); must contain `path`
                supportedTypes:
                  description: block types of the target pod (`info.blockTypes`); others become errors
                  type: array
                  items:
                    type: string
              required:
                - files
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    description: true if there is no error
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        severity:
                          type: string
                          enum:
                            - error
                            - warning
                        code:
                          type: string
                          enum:
                            - fileNotFound
                            - invalidJson
                            - notAnObject
                            - invalidPath
                            - pathTooLong
                            - fileTooLarge
                            - includeTooDeep
                            - includeInvalid
                            - nameMissing
                            - versionUnsupported
                            - peripheralsRange
                            - variableNotInteger
                            - startNotFound
                            - noBlocks
                            - menuInvalid
                            - menuInvalidColor
                            - menuInvalidLed
                            - blockNoNameOrType
                            - duplicateBlock
                            - unknownType
                            - unsupportedType
                            - missingField
                            - notValue
                            - notText
                            - notBool
                            - invalidColor
                            - notNamedColor
                            - delayNeedsMs
                            - randomTimeoutPair
                            - unknownOption
                            - ledsNotList
                            - ledOutOfRange
                            - portNotText
                            - portUnknownTarget
                            - noOutgoing
                            - unreachable
                            - unknownVariable
                            - unknownField
                            - indexInvalid
                            - indexDuplicate
                            - indexNotProgram
                        file:
                          type: string
                          description: store path of the file the issue is in
                        block:
                          type: string
                        field:
                          type: string
                        params:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties:
                            type:
                              - string
                              - number
                      required:
                        - severity
                        - code
                        - file
                      additionalProperties: false
                required:
                  - valid
                  - issues
                additionalProperties: false
        "400":
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/auth/login:
    post:
      operationId: request_login
      summary: Request a sign-in mail
      description: Sends a sign-in mail with a 6-digit code and a link into the Config App. Creates the account on the first sign-in. Always answers 202, also for unknown addresses.
      tags:
        - auth
      x-agent: deny
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                locale:
                  default: en
                  type: string
                  enum:
                    - en
                    - de
              required:
                - email
      responses:
        "202":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                required:
                  - ok
                additionalProperties: false
        "400":
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
