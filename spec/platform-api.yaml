paths:
  /v1/meta:
    get:
      operationId: get_meta
      summary: API information
      description: Version of the ReactPod platform API, the program format it understands, its features and limits. Call this first to find out what the platform supports.
      tags:
        - meta
      x-agent: allow
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: string
                    const: v1
                  version:
                    type: string
                    description: platform release
                  programFormat:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: PROGRAM_FORMAT revision of block fields and semantics (programs.md §6)
                  features:
                    type: array
                    items:
                      type: string
                  limits:
                    type: object
                    properties:
                      maxFileSize:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                        description: bytes per program file
                      maxPath:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                        description: characters per store path
                      maxIncludeDepth:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      maxPeripherals:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                    required:
                      - maxFileSize
                      - maxPath
                      - maxIncludeDepth
                      - maxPeripherals
                    additionalProperties: false
                required:
                  - api
                  - version
                  - programFormat
                  - features
                  - limits
                additionalProperties: false
        "400":
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/programs/validate:
    post:
      operationId: validate_program
      summary: Validate a program
      description: Checks a ReactPod program with the same rules as the Config App and the firmware loader (docs/firmware/programs.md). Pass the program file and any include files it needs; the shipped library parts (/prog/lib/*.json) are available without passing them. Errors stop a program from running on a pod, warnings do not.
      tags:
        - programs
      x-agent: allow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  default: /prog/program.json
                  description: store path of the program among `files`, e.g. /prog/sprint.json
                  type: string
                files:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
                  description: store path → file text (JSON as stored on the pod); must contain `path`
                supportedTypes:
                  description: block types of the target pod (`info.blockTypes`); others become errors
                  type: array
                  items:
                    type: string
              required:
                - files
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    description: true if there is no error
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        severity:
                          type: string
                          enum:
                            - error
                            - warning
                        code:
                          type: string
                          enum:
                            - fileNotFound
                            - invalidJson
                            - notAnObject
                            - invalidPath
                            - pathTooLong
                            - fileTooLarge
                            - includeTooDeep
                            - includeInvalid
                            - nameMissing
                            - versionUnsupported
                            - peripheralsRange
                            - variableNotInteger
                            - startNotFound
                            - noBlocks
                            - menuInvalid
                            - menuInvalidColor
                            - menuInvalidLed
                            - blockNoNameOrType
                            - duplicateBlock
                            - unknownType
                            - unsupportedType
                            - missingField
                            - notValue
                            - notText
                            - notBool
                            - invalidColor
                            - notNamedColor
                            - delayNeedsMs
                            - randomTimeoutPair
                            - unknownOption
                            - ledsNotList
                            - ledOutOfRange
                            - portNotText
                            - portUnknownTarget
                            - tooManyTimers
                            - fieldFormatTooOld
                            - effectWaitEndless
                            - countdownNeedsTimeLimit
                            - countdownTargetNotDelay
                            - fieldWrongMode
                            - signalNeedsGoTime
                            - goTimeBothForms
                            - podSingleOnly
                            - maxMsTooSmall
                            - colorsNotTwo
                            - toggleNeedsDuration
                            - toggleDurationBothForms
                            - countdownNotSupported
                            - noOutgoing
                            - unreachable
                            - unknownVariable
                            - unknownField
                            - fieldNeedsFormat
                            - timerNeverStopped
                            - timerNeverStarted
                            - repeatNoLoop
                            - rangeReversed
                            - indexInvalid
                            - indexDuplicate
                            - indexNotProgram
                        file:
                          type: string
                          description: store path of the file the issue is in
                        block:
                          type: string
                        field:
                          type: string
                        params:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties:
                            type:
                              - string
                              - number
                      required:
                        - severity
                        - code
                        - file
                      additionalProperties: false
                required:
                  - valid
                  - issues
                additionalProperties: false
        "400":
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/auth/login:
    post:
      operationId: request_login
      summary: Request a sign-in mail
      description: Sends a sign-in mail with a 6-digit code and a link into the Config App. Creates the account on the first sign-in. Always answers 202, also for unknown addresses.
      tags:
        - auth
      x-agent: deny
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                locale:
                  default: en
                  type: string
                  enum:
                    - en
                    - de
              required:
                - email
      responses:
        "202":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                required:
                  - ok
                additionalProperties: false
        "400":
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/auth/verify:
    post:
      operationId: verify_login
      summary: Sign in with link token or code
      description: Completes a sign-in with the `token` from the link, or with `email` + `code`. Returns a session token for the Authorization header (Bearer). A code works for 5 attempts.
      tags:
        - auth
      x-agent: deny
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  maxLength: 200
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                code:
                  type: string
                  pattern: ^\d{6}$
                locale:
                  description: used for a new account
                  type: string
                  enum:
                    - en
                    - de
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                    description: ISO 8601 timestamp
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        type: string
                        format: email
                        pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                      displayName:
                        type: string
                      locale:
