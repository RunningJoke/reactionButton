openapi: 3.1.0
info:
  title: ReactPod platform API
  version: 0.1.0
  description: REST API of the ReactPod community platform (docs/platform/spec.md). Generated from the use cases in platform/src – do not edit by hand. AI clients use the same operations as MCP tools at /mcp.
servers:
  - url: https://api.example.org
tags:
  - name: meta
  - name: programs
  - name: auth
  - name: me
  - name: orgs
  - name: athletes
