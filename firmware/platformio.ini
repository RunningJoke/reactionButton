; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = NewBoard

[env]
lib_deps = 


[env:NewBoard]
board = esp32-c3-devkitm-1
platform = espressif32@6.10.0   ; pinned: newer platforms change the ESP-NOW callback API
framework = arduino, espidf
board_build.partitions = partitions.csv
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
board_upload.before_reset = usb_reset
; USB serial: the firmware uses its own HWCDC object (src/Config/Console.h).
; Do not set ARDUINO_USB_CDC_ON_BOOT / ARDUINO_USB_MODE here: with "arduino, espidf"
; they only reach src/, not the Arduino core, and Serial would mean two different objects.
lib_deps = 
	adafruit/Adafruit NeoPixel@^1.12.0
	bblanchon/ArduinoJson@^7.4.2
	h2zero/NimBLE-Arduino@1.4.3
; NimBLE-Arduino brings its own host stack; sdkconfig.NewBoard keeps only the BT controller.
; Peripheral role, one phone, MTU 517 (ADR 0005).
build_flags =
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
	-DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=517
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
	-DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
